name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: gvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d gvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vault:vault@localhost:5432/gvault?sslmode=disable
      DEV_AUTH_BYPASS: "true"
      PROVIDER: nvidia-snapshot
      ENABLE_NVIDIA_PROVIDER: "true"
      # Integration tests construct the in-process harness directly; not a product path.
      ALLOW_TEST_PROVIDER: "true"
      PRODUCT_NAME: Gvault

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -race

      - name: Integration tests
        run: go test ./tests/integration/... -count=1 -tags=integration

      - name: Build binaries
        run: |
          VERSION="$(cat VERSION)"
          LDFLAGS="-X github.com/gvault/gvault/internal/version.Version=${VERSION} -X github.com/gvault/gvault/internal/version.Commit=${GITHUB_SHA}"
          mkdir -p bin
          go build -ldflags "$LDFLAGS" -o bin/gvault-api ./cmd/gvault-api
          go build -ldflags "$LDFLAGS" -o bin/gvault-controller ./cmd/gvault-controller
          go build -ldflags "$LDFLAGS" -o bin/gvaultctl ./cmd/gvaultctl
          test -x bin/gvault-api && test -x bin/gvaultctl

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: gvault-binaries
          path: bin/
          if-no-files-found: error

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gvault/gvault-api:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
