apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultsnapshots.vault.gvault.dev
spec:
  group: vault.gvault.dev
  names:
    kind: VaultSnapshot
    listKind: VaultSnapshotList
    plural: vaultsnapshots
    shortNames: [gsnap]
    singular: vaultsnapshot
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [provider, source]
              properties:
                provider: { type: string }
                clusterId: { type: string }
                retentionPolicy: { type: string }
                labels:
                  type: object
                  additionalProperties: { type: string }
                source:
                  type: object
                  required: [podName, containerName]
                  properties:
                    podName: { type: string }
                    containerName: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                catalogSnapshotId: { type: string }
                providerSnapshotName: { type: string }
                providerSnapshotUid: { type: string }
                providerContentName: { type: string }
                observedGeneration: { type: integer }
                message: { type: string }
                simulated: { type: boolean }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
