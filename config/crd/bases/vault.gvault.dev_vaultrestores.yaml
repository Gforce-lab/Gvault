apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultrestores.vault.gvault.dev
spec:
  group: vault.gvault.dev
  names:
    kind: VaultRestore
    listKind: VaultRestoreList
    plural: vaultrestores
    shortNames: [grest]
    singular: vaultrestore
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [snapshotRef, target]
              properties:
                snapshotRef: { type: string }
                clusterId: { type: string }
                target:
                  type: object
                  required: [podName]
                  properties:
                    podName: { type: string }
                    nodeSelector:
                      type: object
                      additionalProperties: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                catalogOperationId: { type: string }
                message: { type: string }
                simulated: { type: boolean }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Snapshot
          type: string
          jsonPath: .spec.snapshotRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
