apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvault-api
  labels:
    app.kubernetes.io/name: gvault
    app.kubernetes.io/component: api
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gvault
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gvault
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: gvault-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: PROVIDER
              value: {{ .Values.env.PROVIDER | quote }}
            - name: PRODUCT_NAME
              value: {{ .Values.env.PRODUCT_NAME | quote }}
            - name: DEV_AUTH_BYPASS
              value: {{ .Values.env.DEV_AUTH_BYPASS | quote }}
            - name: ENABLE_NVIDIA_PROVIDER
              value: {{ .Values.env.ENABLE_NVIDIA_PROVIDER | quote }}
            {{- if .Values.postgres.url }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gvault-api
  labels:
    app.kubernetes.io/name: gvault
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: gvault
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
