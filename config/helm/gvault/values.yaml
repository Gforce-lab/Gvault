replicaCount: 1
image:
  repository: gvault/gvault-api
  tag: "0.1.0-beta.1"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
env:
  PROVIDER: fake
  DEV_AUTH_BYPASS: "false"
  ENABLE_NVIDIA_PROVIDER: "false"
  PRODUCT_NAME: Gvault
  ENABLE_S3_EXPORT: "false"
  LEADER_ELECTION: "true"
  # ALLOWED_NAMESPACES: "inference,platform"
  # OIDC_ISSUER: ""
  # OIDC_AUDIENCE: gvault
postgres:
  # Point at an external Postgres in real deployments.
  url: ""
resources: {}
leaderElection:
  enabled: true
  id: gvault-controller

