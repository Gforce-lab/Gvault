# CI / test harness overlay — NOT a product GPU path.
# Prefer overlays/nvidia for Phase 1 deployments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: gvault-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: fake
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ALLOW_TEST_PROVIDER
          value: "true"
