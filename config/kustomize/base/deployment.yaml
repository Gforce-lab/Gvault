apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvault-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gvault
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gvault
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: gvault-controller
      containers:
        - name: gvault-api
          image: gvault/gvault-api:0.1.0-beta.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PROVIDER
              value: nvidia-snapshot
            - name: ENABLE_NVIDIA_PROVIDER
              value: "true"
            - name: DEV_AUTH_BYPASS
              value: "false"
            - name: PRODUCT_NAME
              value: Gvault
            - name: LEADER_ELECTION
              value: "true"
            - name: HTTP_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gvault-controller
