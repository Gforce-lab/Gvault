openapi: 3.1.0
info:
  title: Gvault API
  version: 0.1.0
  description: |
    Gvault HTTP API. The product provider is NVIDIA Snapshot v0.3.0.
    The fake provider is a CI-only harness; its outcomes are simulated.
    NVIDIA restore success requires Snapshot completion, Pod readiness, and any configured application probe.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Process health
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Dependencies ready
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/snapshots:
    get:
      summary: List snapshots
      parameters:
        - in: query
          name: clusterId
          schema: { type: string }
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Paginated list
    post:
      summary: Submit capture operation
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
      responses:
        "202":
          description: Accepted after durable persistence
  /api/v1/snapshots/{id}:
    get:
      summary: Get snapshot
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Catalog entry
    delete:
      summary: Submit guarded deletion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Deletion accepted
  /api/v1/snapshots/{id}/compatibility:
    post:
      summary: Preflight compatibility evaluation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibilityRequest"
      responses:
        "200":
          description: Eligibility result
  /api/v1/snapshots/{id}/restore:
    post:
      summary: Submit restore operation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Accepted
  /api/v1/operations/{id}:
    get:
      summary: Get async operation status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Operation
  /api/v1/providers:
    get:
      summary: List providers
      responses:
        "200":
          description: Providers
components:
  schemas:
    CaptureRequest:
      type: object
      required: [name, clusterId, namespace, source]
      properties:
        name: { type: string }
        clusterId: { type: string }
        namespace: { type: string }
        provider: { type: string, default: nvidia-snapshot }
        labels:
          type: object
          additionalProperties: { type: string }
        source:
          type: object
          required: [podName, containerName]
          properties:
            podName: { type: string }
            containerName: { type: string }
    CompatibilityRequest:
      type: object
      required: [targetClusterId]
      properties:
        targetClusterId: { type: string }
        targetNodeName: { type: string }
        gpuProduct: { type: string }
        driverVersion: { type: string }
        architecture: { type: string }
        imageDigest: { type: string }
    RestoreRequest:
      type: object
      required: [targetClusterId, namespace, podName]
      properties:
        targetClusterId: { type: string }
        namespace: { type: string }
        podName: { type: string }
        targetNodeName: { type: string }
        gpuProduct: { type: string }
        driverVersion: { type: string }
        architecture: { type: string }
        imageDigest: { type: string }
        probeEndpoint:
          type: string
          format: uri
          description: Optional legacy HTTP health check. Does not verify generation. Mutually exclusive with inferenceProbe.
        inferenceProbe:
          $ref: "#/components/schemas/InferenceProbe"
        restorePodSpec:
          type: object
          description: >-
            Required for NVIDIA restores. Kubernetes Pod spec for the actual
            workload, including the original container name, digest-pinned image,
            GPU limits, command, model mounts, runtime class, and serving probes.
            Gvault supplies the Snapshot control volume/environment and Never
            restart policy, rejecting conflicting entries. Not included in audits.
          additionalProperties: true
    InferenceProbe:
      type: object
      description: >-
        Optional generation check against the restored Pod IP, after Snapshot
        completion and Pod readiness. openai POSTs a fixed synthetic prompt to
        /v1/completions and requires non-empty text for the requested model;
        snapshot-vllm uses the pinned guide's /generate API and checks non-empty
        text without claiming model identity, which that protocol does not report.
        Uses plain HTTP without authentication; redirects and environment proxies
        are disabled. Mutually exclusive with probeEndpoint.
      allOf:
        - if:
            required: [protocol]
            properties:
              protocol: { const: snapshot-vllm }
          else:
            required: [model]
            properties:
              model: { type: string, minLength: 1 }
      properties:
        protocol:
          type: string
          enum: [openai, snapshot-vllm]
          default: openai
        model:
          type: string
          maxLength: 256
          description: Exact served model name, required for openai and matched in its response. Optional descriptive metadata for snapshot-vllm.
        port:
          type: integer
          minimum: 0
          maximum: 65535
          default: 8000
          description: Omitted or zero selects port 8000.
        timeoutSeconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 60
          description: Omitted or zero selects 60 seconds. Also bounded by the total restore deadline.
